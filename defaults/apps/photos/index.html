<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); --red: #d9543f; --blue: #3f74d9; --green: #4fa87a; --gold: #e2a93b; --scrim: rgba(0, 0, 0, .6); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--door); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }
    .icon svg { width: 100%; height: 100%; }
    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }
    .chip.on { background: var(--ink); color: #fff; }
    .chip:not(.on) { color: var(--ink); }
    .chip .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }
    .round:disabled { background: rgba(255, 255, 255, .3); color: rgba(36, 40, 42, .3); }
    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(16 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .soft-text { color: var(--ink-soft); }
    body { background: #161513; }
    #app { padding: calc(24 * var(--u)); color: #fff; }
    #app.bare { padding: 0; }
    .photo { display: block; width: 100%; height: 100%; object-fit: cover; background: #26241f; }
    /* No photos yet: on the sheet's paper (not the dark gallery), in its ink. */
    .empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: calc(14 * var(--u)); text-align: center; color: var(--ink); max-width: calc(620 * var(--u)); }
    .empty h1 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 600; letter-spacing: -.01em; }
    .empty p { margin: 0 0 calc(14 * var(--u)); font-size: calc(20 * var(--u)); font-weight: 400; line-height: 1.45; color: var(--ink-soft); }
    .grid-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(18 * var(--u)); }
    .grid-top { display: flex; align-items: center; gap: calc(16 * var(--u)); }
    .grow { flex: 1; }
    .picked-count { font-size: calc(26 * var(--u)); font-weight: 600; color: var(--ink, #2a2826); }
    .cell.picked { outline: calc(6 * var(--u)) solid var(--red); outline-offset: calc(-6 * var(--u)); }
    .cell-check { position: absolute; top: calc(8 * var(--u)); right: calc(8 * var(--u)); width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: 50%;
      background: rgba(255, 255, 255, .85); color: transparent; display: grid; place-items: center; box-shadow: inset 0 0 0 calc(3 * var(--u)) rgba(20, 20, 20, .35); }
    .cell-check .icon { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
    .cell.picked .cell-check { background: var(--red); color: #fff; box-shadow: none; }
    .nights { flex: 1; min-width: 0; align-items: center; gap: calc(12 * var(--u)); }
    .at-night { flex: none; font-size: calc(26 * var(--u)); font-weight: 800; padding-right: calc(8 * var(--u)); }
    .night { flex: none; height: calc(66 * var(--u)); border-radius: calc(33 * var(--u)); background: rgba(255, 255, 255, .12); color: #fff; padding: 0 calc(24 * var(--u)); font-size: calc(22 * var(--u)); font-weight: 700; white-space: nowrap; }
    .night.on { background: #fff; color: var(--ink); }
    .grid-scroll { flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: calc(14 * var(--u)); }
    .cell { position: relative; aspect-ratio: 1; border-radius: calc(16 * var(--u)); overflow: hidden; }
    .cell .photo { position: absolute; inset: 0; }
    .cell-off { position: absolute; top: calc(6 * var(--u)); right: calc(6 * var(--u)); width: calc(52 * var(--u)); height: calc(52 * var(--u)); border: 0; border-radius: 50%; padding: 0;
      background: rgba(20, 20, 20, .45); color: #fff; display: grid; place-items: center; }
    .cell-off .icon { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
    .preview { height: calc(380 * var(--u)); border-radius: calc(20 * var(--u)); }
    .show { position: absolute; inset: 0; background: #000; overflow: hidden; }
    .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
    .slide.on { opacity: 1; }
    .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 75%, rgba(0, 0, 0, .53)); }
    .grid.small { grid-template-columns: repeat(6, minmax(0, 1fr)); max-height: calc(460 * var(--u)); }
    .caption { position: absolute; left: calc(40 * var(--u)); right: calc(40 * var(--u)); bottom: calc(66 * var(--u)); font-size: calc(34 * var(--u)); font-weight: 600; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
    .caption:empty { display: none; }
    .albums { flex: 1; min-width: 0; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; }
    .preview.big { height: calc(460 * var(--u)); width: 100%; object-fit: contain; background: #1d1c19; }
    .sheet .row { display: flex; align-items: center; gap: calc(14 * var(--u)); }
    .sheet .label { flex: none; width: calc(90 * var(--u)); font-size: calc(18 * var(--u)); color: var(--ink-soft); }
    .note { margin: 0; font-size: calc(20 * var(--u)); color: var(--ink-soft); }
    .note.small { font-size: calc(17 * var(--u)); }
    .way { border-radius: calc(20 * var(--u)); background: rgba(36, 40, 42, .05); padding: calc(20 * var(--u)) calc(24 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); }
    .way-title { font-size: calc(26 * var(--u)); font-weight: 600; }
    .count { position: absolute; left: calc(40 * var(--u)); bottom: calc(30 * var(--u)); font-size: calc(22 * var(--u)); font-weight: 700; color: rgba(255, 255, 255, .8); }
  </style>
  <link rel="stylesheet" href="/kit/quiet.css">
</head>
<body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
