<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); --red: #d9543f; --blue: #3f74d9; --green: #4fa87a; --gold: #e2a93b; --scrim: rgba(0, 0, 0, .6); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--surface); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }
    .icon svg { width: 100%; height: 100%; }
    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }
    .chip.on { background: var(--ink); color: #fff; }
    .chip .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }
    .round:disabled { background: rgba(255, 255, 255, .3); color: rgba(36, 40, 42, .3); }
    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(10 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .gl { display: inline-flex; flex: none; }
    .gl svg { width: 100%; height: 100%; }

    /* The lists side by side, a panel each: the first white, the rest each on a faint tint of its own (--t, mixed into
       the panel's color so it follows the look). One sorted by store section is wider, its sections in two columns. */
    .new-list { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); }
    .new-list .icon { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
    .ltabs { display: none; }
    .lcs { flex: 1; min-height: 0; display: flex; gap: calc(16 * var(--u)); padding-bottom: calc(8 * var(--u)); }
    .lc { flex: 1 1 0; min-width: calc(300 * var(--u)); max-width: calc(780 * var(--u)); border-radius: calc(30 * var(--u)); padding: calc(22 * var(--u)) calc(22 * var(--u)) calc(18 * var(--u)); display: flex; flex-direction: column; }
    .lc.wide { flex-grow: 1.7; min-width: calc(480 * var(--u)); max-width: calc(1000 * var(--u)); }
    html:root .lc.tinted { background: color-mix(in srgb, var(--t) 12.5%, var(--card)); }
    .lt { display: flex; align-items: center; gap: calc(12 * var(--u)); flex: none; }
    .lt-name { flex: 1; min-width: 0; }
    .lname { margin: 0; font-size: calc(32 * var(--u)); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; overflow-wrap: anywhere; }
    .lt .n { font-size: calc(16 * var(--u)); font-weight: 650; color: var(--fg2); margin-top: calc(6 * var(--u)); }
    .add-field { flex: none; font: inherit; font-size: calc(19 * var(--u)); font-weight: 500; width: 100%; height: calc(54 * var(--u)); border: 0; border-radius: calc(18 * var(--u)); margin: calc(16 * var(--u)) 0 calc(6 * var(--u)); background: var(--tint); padding: 0 calc(18 * var(--u)); color: var(--ink);
      outline: none; user-select: text; -webkit-user-select: text; }
    .add-field::placeholder { color: var(--fg3); }
    .add-field:focus { background: var(--tint-2); }
    .items { flex: 1; }
    .wide .two { column-count: 2; column-gap: calc(22 * var(--u)); }
    .group { break-inside: avoid; }
    .aisle { display: flex; align-items: center; gap: calc(10 * var(--u)); padding: calc(16 * var(--u)) 0 calc(4 * var(--u)); }
    .aisle .d { width: calc(34 * var(--u)); height: calc(34 * var(--u)); border-radius: calc(11 * var(--u)); display: grid; place-items: center; flex: none; color: #15132b; background: var(--a); }
    .aisle .d .gl { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
    .it { display: flex; align-items: center; gap: calc(14 * var(--u)); min-height: calc(56 * var(--u)); padding: calc(6 * var(--u)) 0; font-size: calc(22 * var(--u)); font-weight: 600; letter-spacing: -.015em; line-height: 1.15; break-inside: avoid; position: relative; }
    .it + .it { border-top: 1px solid var(--hair); }
    .lc:not(.wide) .it { min-height: calc(68 * var(--u)); }
    html:root .it .q-check { width: calc(32 * var(--u)); height: calc(32 * var(--u)); border-width: calc(2.8 * var(--u)); }
    .it .q-check .icon svg { stroke-width: 3.2; }
    .it .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .it.done .text { color: var(--fg3); text-decoration: line-through; }
    /* (the keyboard's way to an item's card; a finger holds the item) */
    .more { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: calc(34 * var(--u)); height: calc(34 * var(--u)); border: 0; border-radius: 50%; background: transparent; color: var(--fg2); display: grid; place-items: center; padding: 0; opacity: 0; pointer-events: none; }
    .more:focus-visible { opacity: 1; }
    .more .icon { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
    /* what's ticked, set apart at the foot */
    .cart { margin-top: calc(18 * var(--u)); padding: calc(14 * var(--u)) calc(18 * var(--u)) calc(6 * var(--u)); border-radius: calc(20 * var(--u)); background: var(--tint); }
    .cart-items { display: grid; grid-template-columns: 1fr; column-gap: calc(26 * var(--u)); }
    .wide .cart-items { grid-template-columns: 1fr 1fr; }
    html:root .cart .it { min-height: calc(48 * var(--u)); padding: calc(4 * var(--u)) 0; font-size: calc(20 * var(--u)); border: 0; }
    .foot { flex: none; display: flex; gap: calc(10 * var(--u)); padding-top: calc(12 * var(--u)); }
    html:root .foot .btn { height: calc(44 * var(--u)); font-size: calc(16 * var(--u)); padding: 0 calc(16 * var(--u)); min-width: 0; display: inline-flex; align-items: center; gap: calc(8 * var(--u)); }
    .foot .gl { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }

    /* On a phone: the lists' names along the top, the chosen one filling the screen under them. */
    @media (max-width: 700px) {
      html:root body .top { flex-wrap: nowrap; }
      html:root body .top > .title { flex: 1 1 0; }
      html:root body .new-list { width: calc(60 * var(--u)); min-width: 0; padding: 0; justify-content: center; border-radius: 50%; }
      .new-list span:not(.icon) { display: none; }
      .new-list .icon { width: calc(30 * var(--u)); height: calc(30 * var(--u)); }
      .ltabs { display: flex; flex: none; gap: calc(12 * var(--u)); padding-bottom: calc(14 * var(--u)); margin-bottom: calc(6 * var(--u)); }
      .ltabs .chip b { font-weight: 650; opacity: .6; margin-left: calc(10 * var(--u)); }
      .lcs { padding-bottom: 0; margin-bottom: calc(-24 * var(--u)); } /* (to the foot of the screen, past #app's own padding) */
      html:root .lc, html:root .lc.wide { display: none; flex: 1; min-width: 0; max-width: none; border-radius: calc(40 * var(--u)) calc(40 * var(--u)) 0 0; padding: calc(26 * var(--u)) calc(26 * var(--u)) 0; }
      html:root .lc.cur { display: flex; }
      .lt { display: none; }
      .add-field { height: calc(72 * var(--u)); border-radius: calc(24 * var(--u)); font-size: calc(26 * var(--u)); padding: 0 calc(23 * var(--u)); margin: 0 0 calc(6 * var(--u)); }
      .wide .two { column-count: 1; }
      .aisle { padding: calc(23 * var(--u)) 0 calc(3 * var(--u)); gap: calc(14 * var(--u)); }
      .aisle .d { width: calc(43 * var(--u)); height: calc(43 * var(--u)); border-radius: calc(14 * var(--u)); }
      .aisle .d .gl { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
      .it, .lc:not(.wide) .it { min-height: calc(75 * var(--u)); font-size: calc(29 * var(--u)); gap: calc(20 * var(--u)); }
      html:root .it .q-check { width: calc(43 * var(--u)); height: calc(43 * var(--u)); border-width: calc(3.7 * var(--u)); }
      html:root .cart .it { min-height: calc(66 * var(--u)); font-size: calc(26 * var(--u)); }
      .wide .cart-items { grid-template-columns: 1fr; }
      .cart { border-radius: calc(26 * var(--u)); padding: calc(18 * var(--u)) calc(22 * var(--u)) calc(8 * var(--u)); }
      .foot { padding: calc(14 * var(--u)) 0 calc(20 * var(--u)); }
      html:root .foot .btn { height: calc(56 * var(--u)); font-size: calc(21 * var(--u)); padding: 0 calc(22 * var(--u)); }
      .foot .gl { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
    }
  </style>
  <link rel="stylesheet" href="/kit/quiet.css">
  <link rel="stylesheet" href="/kit/narrow.css">
</head>
<body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
