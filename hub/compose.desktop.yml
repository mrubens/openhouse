# Opie hub on a forwarded port instead of the host's network: Docker Desktop on a Mac or Windows (whose host network
# is a VM's), and trying it on any computer (README, "Try it on a computer first"). Phones, computers and the TV reach
# it; finding devices on the Wi-Fi doesn't work from here (hub/compose.yml does, on Linux).
#   docker compose -f hub/compose.desktop.yml up -d --build
services:
  openhouse:
    container_name: openhouse
    image: openhouse-hub
    build: { context: .., dockerfile: hub/Dockerfile }
    restart: unless-stopped
    ports:
      - "8788:8788"
      # - "8789:8789"        # the connector at your own https address (web-mcp.js), behind a tunnel
    volumes:
      - ./data:/data
      - ./keeper:/keeper
      - ./backups:/backups
    environment:
      OPENHOUSE_KEEPER_DIR: /keeper
      OPENHOUSE_UPDATE_COMMAND: git pull && docker compose -f hub/compose.desktop.yml up -d --build   # (the settings page shows it)
      TZ: ${TZ:-UTC}
