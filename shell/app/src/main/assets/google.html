<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OpenHouse</title>
<style>
:root{--bg:#fbf9f5;--ink:#2a2826;--soft:#6e6a65;--line:#e7e3dc;--tint:#f1eee9;--go:#2a2826;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:28px 20px 48px}
main::before{content:"OpenHouse";display:block;font-weight:600;font-size:17px;margin-bottom:40px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 20px}
ol{margin:0 0 8px;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 14px 40px;color:var(--ink)}
ol li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--tint);font-size:15px;font-weight:600;display:grid;place-items:center}
label{display:block;color:var(--soft);font-size:15px;margin:18px 0 6px}
input,select{width:100%;font:inherit;padding:13px 16px;border:0;border-radius:14px;background:var(--tint);color:inherit;outline-color:var(--ink)}
button,a.b{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:999px;background:var(--go);color:var(--bg);font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
a.b{background:var(--tint);color:var(--ink)}
button:disabled{opacity:.5}
p{color:var(--soft)}
[hidden]{display:none!important}
</style><style>
input[type=file]{padding:18px;border-style:dashed}
#how{font-size:15px}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--go)}
</style></head>
<body><main>
<h1 id="t">Photos from Google Photos</h1>
<div id="start" hidden>
  <p>Sign in to Google and pick the photos for the tablet. OpenHouse sees only the ones you pick, once, and copies them to the tablet.</p>
  <button id="go">Sign in to Google</button>
</div>
<div id="pick" hidden>
  <p>Now choose the photos in Google Photos, then come back here.</p>
  <a class="b" id="open" target="_blank" rel="noopener noreferrer">Choose in Google Photos</a>
</div>
<div class="bar" id="bar" hidden><i id="fill"></i></div>
<p id="m"></p>
</main>
<script>
// Photos from Google Photos, through Google's Picker API (docs/photos.md), from a phone on the home Wi-Fi. This
// page is the tablet's (GooglePhotos.kt), opened from its QR code: http://<tablet>:<port>/#<key>.
//   1. Sign in: the tablet asks OpenHouse's cloud for a one-time link (POST s {start}: the bridge's /cloud/google/start,
//      with the tablet's credential, naming this page; the link comes back as info.signin). The phone opens it: the cloud
//      sends it to Google's consent screen and back here with an access token after # (#g=…; it never leaves the
//      phone). The key waits in sessionStorage meanwhile.
//   Google Calendar (CalendarAccounts.kt, info.kind "cal"): the same page, signing in for the calendars (a link of kind cal);
//      the cloud sends back a refresh token (#gc=…), sealed for the tablet, which keeps it; then the calendars are
//      chosen on the tablet.
//   2. The token, sealed with the key, to the tablet (POST s). The tablet starts a picking session with Google and
//      says where to pick (GET i: its pickerUri), copies what was picked straight from Google, and forgets the token.
'use strict';
const CP = (() => {
  const rotl = (x, n) => (x << n) | (x >>> (32 - n));
  function block(k, ctr, n) { // k: Uint32Array(8), n: Uint32Array(3) -> 64 bytes
    const s = new Uint32Array([0x61707865, 0x3320646e, 0x79622d32, 0x6b206574, ...k, ctr, ...n]), x = s.slice();
    const q = (a, b, c, d) => { x[a] += x[b]; x[d] = rotl(x[d] ^ x[a], 16); x[c] += x[d]; x[b] = rotl(x[b] ^ x[c], 12);
      x[a] += x[b]; x[d] = rotl(x[d] ^ x[a], 8); x[c] += x[d]; x[b] = rotl(x[b] ^ x[c], 7); };
    for (let i = 0; i < 10; i++) { q(0, 4, 8, 12); q(1, 5, 9, 13); q(2, 6, 10, 14); q(3, 7, 11, 15); q(0, 5, 10, 15); q(1, 6, 11, 12); q(2, 7, 8, 13); q(3, 4, 9, 14); }
    for (let i = 0; i < 16; i++) x[i] += s[i];
    return new Uint8Array(x.buffer);
  }
  const words = (b) => { const w = new Uint32Array(b.length / 4), v = new DataView(b.buffer, b.byteOffset, b.length); for (let i = 0; i < w.length; i++) w[i] = v.getUint32(i * 4, true); return w; };
  function xor(key, nonce, ctr, data) {
    const k = words(key), n = words(nonce), out = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i += 64) { const ks = block(k, ctr++, n); for (let j = 0; j < 64 && i + j < data.length; j++) out[i + j] = data[i + j] ^ ks[j]; }
    return out;
  }
  const num = (b) => { let r = 0n; for (let i = b.length - 1; i >= 0; i--) r = (r << 8n) | BigInt(b[i]); return r; };
  function poly(key, msg) {
    const r = num(key.subarray(0, 16)) & 0x0ffffffc0ffffffc0ffffffc0fffffffn, s = num(key.subarray(16, 32)), p = (1n << 130n) - 5n;
    let a = 0n;
    for (let i = 0; i < msg.length; i += 16) { const c = msg.subarray(i, i + 16); a = ((a + num(c) + (1n << BigInt(8 * c.length))) * r) % p; }
    a = (a + s) & ((1n << 128n) - 1n);
    const t = new Uint8Array(16); for (let i = 0; i < 16; i++) { t[i] = Number(a & 0xffn); a >>= 8n; } return t;
  }
  function mac(key, nonce, aad, ct) {
    const pad = (n) => (16 - (n % 16)) % 16, m = new Uint8Array(aad.length + pad(aad.length) + ct.length + pad(ct.length) + 16);
    m.set(aad, 0); m.set(ct, aad.length + pad(aad.length));
    const v = new DataView(m.buffer, m.length - 16); v.setUint32(0, aad.length, true); v.setUint32(8, ct.length, true);
    return poly(block(words(key), 0, words(nonce)).subarray(0, 32), m);
  }
  return {
    seal(key, nonce, aad, pt) { const ct = xor(key, nonce, 1, pt), out = new Uint8Array(12 + ct.length + 16); out.set(nonce); out.set(ct, 12); out.set(mac(key, nonce, aad, ct), 12 + ct.length); return out; },
    open(key, aad, box) {
      const nonce = box.subarray(0, 12), ct = box.subarray(12, box.length - 16), tag = box.subarray(box.length - 16);
      const want = mac(key, nonce, aad, ct); let d = 0; for (let i = 0; i < 16; i++) d |= want[i] ^ tag[i];
      return d || box.length < 28 ? null : xor(key, nonce, 1, ct);
    },
  };
})();
const b64 = { dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)),
  enc: (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
const te = new TextEncoder(), td = new TextDecoder();
(async () => {
  const $ = (id) => document.getElementById(id), say = (t) => { $('m').textContent = t; };
  const h = location.hash.slice(1);
  let k64 = h;
  const KEEP = 'openhouse-google';
  if (h.startsWith('g=') || h.startsWith('gc=') || h === 'g-no') { try { k64 = sessionStorage.getItem(KEEP) || ''; } catch { k64 = ''; } }
  history.replaceState(null, '', location.pathname); // neither the key nor a token stays in the address bar
  let key; try { key = b64.dec(k64); } catch {}
  if (!key || key.length !== 32) return say('Scan the code on the tablet again.');
  const info = async () => { try { const r = await fetch('i', { cache: 'no-store' }); const box = CP.open(key, te.encode('info'), b64.dec(await r.text())); return box && JSON.parse(td.decode(box)); } catch { return null; } };
  let i = await info();
  if (!i) return say('This link has ended. Start again on the tablet.');
  const cal = i.kind === 'cal';
  if (cal) {
    document.title = 'OpenHouse: Google Calendar'; $('t').textContent = 'Google Calendar';
    $('start').querySelector('p').textContent = 'Sign in to Google so the tablet and Google Calendar show the same events, and what’s added on either shows up on both. The sign-in stays sealed on the tablet.';
  }
  if (!i.cloud) return say('Google isn’t available right now. Try again later.');
  $('go').onclick = async () => { // a fresh link each time: it works once, for a few minutes
    $('go').disabled = true; say('');
    let to = null;
    try {
      const r = await fetch('s', { method: 'POST', body: CP.seal(key, crypto.getRandomValues(new Uint8Array(12)), te.encode('send'), te.encode(JSON.stringify({ start: true }))), headers: { 'content-type': 'application/octet-stream' } });
      if (r.ok) to = (await info())?.signin || null;
    } catch {}
    $('go').disabled = false;
    if (!to) return say('Google isn’t available right now. Try again later.');
    try { sessionStorage.setItem(KEEP, k64); } catch {}
    location.href = to;
  };
  if (h === 'g-no') say('Google said no, or it was cancelled. Try again?');
  if (h.startsWith('gc=')) { // the calendars' sign-in: the refresh token to the tablet, sealed
    try { sessionStorage.removeItem(KEEP); } catch {}
    try {
      const r = await fetch('s', { method: 'POST', body: CP.seal(key, crypto.getRandomValues(new Uint8Array(12)), te.encode('send'), te.encode(JSON.stringify({ refresh: decodeURIComponent(h.slice(3)) }))), headers: { 'content-type': 'application/octet-stream' } });
      if (!r.ok) throw 0;
    } catch { return say('The tablet didn’t take it. Start again on the tablet.'); }
    $('start').hidden = true;
    return say('Signed in. Choose which calendars to show on the tablet.');
  }
  if (h.startsWith('g=')) {
    try { sessionStorage.removeItem(KEEP); } catch {}
    const token = decodeURIComponent(h.slice(2));
    say('Asking Google…');
    try {
      const r = await fetch('s', { method: 'POST', body: CP.seal(key, crypto.getRandomValues(new Uint8Array(12)), te.encode('send'), te.encode(JSON.stringify({ token }))), headers: { 'content-type': 'application/octet-stream' } });
      if (!r.ok) throw 0;
    } catch { return say('The tablet didn’t take it. Start again on the tablet.'); }
  }
  // Follow the tablet: signing in, picking, copying, done.
  for (;;) {
    if (i.state === 'signedin') { $('start').hidden = true; return say('Signed in. Choose which calendars to show on the tablet.'); }
    $('start').hidden = i.state !== 'start'; $('pick').hidden = i.state !== 'picking';
    if (i.pickerUri) $('open').href = i.pickerUri + (/autoclose$/.test(i.pickerUri) ? '' : '/autoclose');
    $('bar').hidden = i.state !== 'copying';
    if (i.state === 'copying') { $('fill').style.width = `${Math.round(100 * (i.done || 0) / Math.max(1, i.total || 1))}%`; say(`Copying ${i.done || 0} of ${i.total || 0} to the tablet…`); }
    else if (i.state === 'picking') say('');
    else if (i.state === 'done') { say(i.total ? (i.done === 1 ? 'Done: 1 photo is in Photos on the tablet.' : `Done: ${i.done} photos are in Photos on the tablet.`) : 'Nothing was picked.'); $('start').hidden = false; $('go').textContent = 'Pick more'; }
    else if (i.state === 'error') { say(i.error || 'That didn’t work. Try again.'); $('start').hidden = false; }
    await new Promise((ok) => setTimeout(ok, i.state === 'start' ? 4000 : 2000));
    const n = await info(); if (!n) return say('This link has ended. Start again on the tablet.');
    i = n;
  }
})();
</script>
</body></html>
