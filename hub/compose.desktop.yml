# Opie hub under Docker Desktop (a Mac, Windows): a forwarded port instead of the host's network, which on Docker
# Desktop is a VM's. Phones, computers and the TV reach it; finding devices on the Wi-Fi doesn't work from here.
#   docker compose -f hub/compose.desktop.yml up -d --build
services:
  openhouse:
    container_name: openhouse
    image: openhouse-hub
    build: { context: .., dockerfile: hub/Dockerfile }
    restart: unless-stopped
    ports:
      - "8788:8788"
      # - "8789:8789"        # the connector at your own https address (web-mcp.js), behind a tunnel
    volumes:
      - ./data:/data
      - ./keeper:/keeper
      - ./backups:/backups
    environment:
      OPENHOUSE_KEEPER_DIR: /keeper
      TZ: ${TZ:-UTC}
