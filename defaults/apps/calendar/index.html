  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */

    .mchip { height: calc(58 * var(--u)); border-radius: calc(29 * var(--u)); padding: 0; background: rgba(36, 40, 42, .07); font-size: calc(24 * var(--u)); font-weight: 700; color: var(--ink); }

    .dh { padding: calc(14 * var(--u)) calc(14 * var(--u)) calc(12 * var(--u)); min-width: 0; z-index: 1; }

    .dh .n b { font-weight: inherit; }

    .sky { display: flex; }

    /* No z-index: the parts' names sit alone in the first column, where no day's column paints. With one, each was a

    .mhead, .mweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: calc(8 * var(--u)); }
    .mhead { flex: none; padding-top: calc(2 * var(--u)); }
    .mdow { padding-left: calc(14 * var(--u)); }

    .mweek.this { flex: 1.34; }
    .cell { min-height: 0; min-width: 0; border-radius: calc(20 * var(--u)); background: color-mix(in srgb, var(--card) 75%, transparent); }

    .nothing { margin: 0; padding-top: calc(60 * var(--u)); }

    .sch-ev span { font-size: calc(17 * var(--u)); color: var(--fg2); }

    .dayview { flex: 1; min-height: 0; display: grid; grid-template-columns: calc(372 * var(--u)) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: calc(20 * var(--u)); padding-bottom: calc(16 * var(--u)); }
