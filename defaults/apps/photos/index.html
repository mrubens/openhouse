<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }
    .icon svg { width: 100%; height: 100%; }
    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }
    .chip.on { background: var(--ink); color: #fff; }
    .chip:not(.on) { color: var(--ink); }
    .chip .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }
    .round:disabled { background: rgba(255, 255, 255, .3); color: rgba(36, 40, 42, .3); }
    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(16 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .soft-text { color: var(--ink-soft); }
    #app.bare { padding: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(9 * var(--u)); }
    .btn .icon { width: calc(20 * var(--u)); height: calc(20 * var(--u)); flex: none; }
    .btn.warn { background: var(--accent); color: var(--accent-ink, #fff); }
    .photo { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--tint-2); }
    .grow { flex: 1; }
    /* no photos yet */
    .empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: calc(14 * var(--u)); text-align: center; color: var(--ink); max-width: calc(620 * var(--u)); }
    .empty .mark { width: calc(76 * var(--u)); height: calc(76 * var(--u)); border-radius: calc(24 * var(--u)); background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; margin-bottom: calc(8 * var(--u)); }
    .empty .mark .icon { width: calc(36 * var(--u)); height: calc(36 * var(--u)); }
    .empty h1 { margin: 0; letter-spacing: -.02em; }
    .empty p { margin: 0 0 calc(14 * var(--u)); line-height: 1.45; color: var(--fg2); }

    /* all of them: the head (the name and how many, the albums, what to do), then a mosaic that scrolls */
    .grid-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .albums { flex: 0 1 auto; min-width: 0; border-radius: calc(26 * var(--u)); }
    .top > .title { flex: none; white-space: nowrap; } /* the title stays whole; the albums scroll beside it */
    .albums .q-seg > * { flex: none; }
    .albums .q-seg .icon { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
    .picked-count { flex: 1; min-width: 0; font-size: calc(24 * var(--u)); font-weight: 650; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grid-scroll { flex: 1; container-type: size; margin: 0 calc(-12 * var(--u)); padding: 0 calc(12 * var(--u)); }
    /* six across, four rows to a screen: every eleven photos fill it (two big, three wide, six small) */
    .mos { --row: calc((100vh - 104 * var(--u)) / 4); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: max(calc(150 * var(--u)), var(--row)); grid-auto-flow: dense;
      gap: calc(10 * var(--u)); padding-bottom: calc(26 * var(--u)); }
    @supports (height: 1cqh) { .mos { --row: calc((100cqh - 30 * var(--u)) / 4); } }
    .cell { position: relative; border-radius: var(--r-card); overflow: hidden; box-shadow: 0 16px 30px -18px rgba(40, 30, 10, .5); background: var(--tint-2); }
    .cell.w { grid-column: span 2; }
    .cell.b, .cell.b2 { grid-column: span 3; grid-row: span 2; }
    .cell .photo { position: absolute; inset: 0; }
    .cell-clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; pointer-events: none; } .cell-clip.on { opacity: 1; } /* a video playing silently over its still (main.js gridClip) */
    :root .cell > .cap { position: absolute; z-index: 2; left: calc(22 * var(--u)); right: calc(22 * var(--u)); bottom: calc(18 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell .cap small { display: block; font-size: calc(15 * var(--u)); font-weight: 600; opacity: .8; letter-spacing: 0; margin-top: calc(2 * var(--u)); }
    .cell-check { position: absolute; top: calc(10 * var(--u)); right: calc(10 * var(--u)); width: calc(34 * var(--u)); height: calc(34 * var(--u)); border-radius: 50%; z-index: 2;
      background: rgba(255, 255, 255, .85); color: transparent; display: grid; place-items: center; box-shadow: inset 0 0 0 calc(2.5 * var(--u)) rgba(20, 20, 30, .4); }
    .cell-check .icon { width: 64%; height: 64%; }
    .cell.picked { outline: calc(4 * var(--u)) solid var(--ink); outline-offset: calc(-4 * var(--u)); }
    .cell.picked .cell-check { background: var(--ink); color: var(--on-ink); box-shadow: none; }

    /* one photo, and the slideshow: the picture fills the pane, with glass over it (fixed colors: they sit on a photo) */
    .show, .one { position: absolute; inset: 0; background: #0b0b10; overflow: hidden; color: #fff; }
    .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
    .slide.on { opacity: 1; }
    .one-back { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; filter: blur(calc(50 * var(--u))) brightness(.6) saturate(1.3); }
    .one-pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .one-pic.fill { object-fit: cover; }
    .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6, 8, 16, .34) 0, rgba(6, 8, 16, 0) 18%, rgba(6, 8, 16, 0) 58%, rgba(6, 8, 16, .78) 100%); }
    .show .shade { background: linear-gradient(180deg, rgba(6, 8, 16, 0) 62%, rgba(6, 8, 16, .7) 100%); }
    .glass { background: rgba(10, 12, 24, .42); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: #fff; }
    .one-top { position: absolute; left: calc(20 * var(--u)); right: calc(20 * var(--u)); top: calc(20 * var(--u)); display: flex; gap: calc(10 * var(--u)); align-items: center; }
    .pill { flex: none; height: calc(46 * var(--u)); border-radius: calc(23 * var(--u)); padding: 0 calc(20 * var(--u)) 0 calc(16 * var(--u)); display: inline-flex; align-items: center; gap: calc(8 * var(--u)); font-size: calc(17 * var(--u)); font-weight: 600; white-space: nowrap; }
    .pill .icon, .rbtn .icon { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
    .rbtn { flex: none; width: calc(46 * var(--u)); height: calc(46 * var(--u)); border-radius: 50%; display: grid; place-items: center; }
    .rbtn.arr { position: absolute; top: 50%; margin-top: calc(-52 * var(--u)); width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
    .rbtn.arr .icon { width: calc(30 * var(--u)); height: calc(30 * var(--u)); }
    .rbtn.arr.l { left: calc(20 * var(--u)); } .rbtn.arr.r { right: calc(20 * var(--u)); }
    .capt { position: absolute; left: calc(28 * var(--u)); right: calc(28 * var(--u)); bottom: calc(150 * var(--u)); text-shadow: 0 2px 16px rgba(0, 0, 0, .5); pointer-events: none; }
    .show .capt { bottom: calc(34 * var(--u)); left: calc(36 * var(--u)); }
    .capt h1 { margin: 0; font-size: calc(56 * var(--u)); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .capt h1:empty { display: none; }
    .capt p { margin: calc(10 * var(--u)) 0 0; font-size: calc(21 * var(--u)); font-weight: 600; color: rgba(255, 255, 255, .8); }
    .film { position: absolute; left: calc(20 * var(--u)); right: calc(20 * var(--u)); bottom: calc(20 * var(--u)); height: calc(104 * var(--u)); padding: calc(10 * var(--u)); border-radius: calc(26 * var(--u)); display: flex; gap: calc(8 * var(--u)); justify-content: center; }
    .film > * { flex: 1; max-width: calc(170 * var(--u)); min-width: 0; border-radius: calc(16 * var(--u)); overflow: hidden; opacity: .7; position: relative; }
    .film > .on { flex: 1.5; max-width: calc(250 * var(--u)); opacity: 1; box-shadow: 0 0 0 calc(3.5 * var(--u)) #fff; }
    .film .photo { background: rgba(255, 255, 255, .1); }

    /* a video: a play mark on its still in the grid; in the one view, a round play button over it, then the video itself */
    .vid-mark { position: absolute; z-index: 1; right: calc(12 * var(--u)); bottom: calc(12 * var(--u)); width: calc(40 * var(--u)); height: calc(40 * var(--u)); border-radius: 50%;
      background: rgba(10, 12, 24, .42); color: #fff; display: grid; place-items: center; pointer-events: none; }
    .vid-mark .icon { width: 50%; height: 50%; margin-left: 8%; }
    .vid-mark .icon svg { fill: currentColor; }
    .film .vid-mark { width: calc(26 * var(--u)); height: calc(26 * var(--u)); right: calc(6 * var(--u)); bottom: calc(6 * var(--u)); }
    .one-play { position: absolute; left: 50%; top: 50%; width: calc(116 * var(--u)); height: calc(116 * var(--u)); margin: calc(-58 * var(--u)) 0 0 calc(-58 * var(--u)); border-radius: 50%; display: grid; place-items: center; }
    .one-play[hidden] { display: none; }
    .one-play .icon { width: calc(48 * var(--u)); height: calc(48 * var(--u)); margin-left: calc(6 * var(--u)); }
    .one-play .icon svg { fill: currentColor; }
    video.one-pic { background: transparent; opacity: 0; transition: opacity .25s ease; }
    video.one-pic.on { opacity: 1; }
    .one-pic.under { visibility: hidden; }
    video::-webkit-media-controls, video::-webkit-media-controls-overlay-play-button, video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
    .one.playing .shade, .one.playing .capt, .one.playing .film, .one.playing .rbtn.arr { opacity: 0; transition: opacity .4s ease; pointer-events: none; }
    .slide.vid { object-fit: cover; }

    /* the cards over it */
    .preview { height: calc(380 * var(--u)); border-radius: var(--r-card); }
    .preview.big { height: calc(460 * var(--u)); width: 100%; object-fit: contain; background: var(--tint); }
    .grid.small { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(10 * var(--u)); max-height: calc(460 * var(--u)); }
    .grid.small .cell { aspect-ratio: 1; border-radius: var(--r-tile); box-shadow: none; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; }
    .sheet .row { display: flex; align-items: center; gap: calc(14 * var(--u)); }
    .sheet .label { flex: none; width: calc(90 * var(--u)); }
    .sheet p { margin: 0; font-size: calc(18 * var(--u)); font-weight: 500; color: var(--fg2); }
    .note { margin: 0; font-size: calc(20 * var(--u)); color: var(--fg2); line-height: 1.4; }
    .note.small { font-size: calc(17 * var(--u)); }
    .way { border-radius: var(--r-card); background: var(--tint); padding: calc(18 * var(--u)) calc(22 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); }
    .way:active { background: var(--tint-2); }
    .way-title { font-size: calc(21 * var(--u)); font-weight: 600; letter-spacing: -.01em; }

    /* a phone: the name with two round buttons beside it, the albums as pills under it, the mosaic three across */
    @media (max-width: 700px) {
      html:root #app .top > .title { flex: 1 1 0; }
      html:root #app .top > .albums { order: 9; flex: 1 0 100%; margin: 0 calc(-22 * var(--u)); padding: 0 calc(22 * var(--u)) calc(14 * var(--u)); border-radius: 0; margin-bottom: calc(-14 * var(--u)); }
      html:root .albums .q-seg { background: none; padding: 0; gap: calc(10 * var(--u)); border-radius: 0; }
      html:root .albums .q-seg > * { height: calc(58 * var(--u)); border-radius: calc(29 * var(--u)); padding: 0 calc(24 * var(--u)); background: var(--tint); color: var(--ink); }
      html:root .albums .q-seg > .on { background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-pill); }
      html:root .top .btn.ic { min-width: 0; width: calc(60 * var(--u)); padding: 0; border-radius: 50%; }
      html:root .top .btn.ic .lbl { display: none; }
      html:root .top .btn.ic .icon { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
      html:root .picked-count { flex: 1 0 100%; }
      html:root .grid-scroll { margin: 0; padding: 0; }
      html:root:not(.in-tab) .grid-scroll { margin: 0 calc(-10 * var(--u)); }
      html:root .mos { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: calc(175 * var(--u)); gap: calc(6 * var(--u)); padding-bottom: calc(130 * var(--u)); }
      html:root .cell { border-radius: calc(17 * var(--u)); box-shadow: none; }
      html:root .cell.w { grid-column: span 1; }
      html:root .cell.b2 { grid-column: span 2; }
      html:root .cell .cap { font-size: calc(29 * var(--u)); left: calc(20 * var(--u)); bottom: calc(17 * var(--u)); }
      html:root .cell .cap small { font-size: calc(19 * var(--u)); }
      html:root .cell-check { width: calc(40 * var(--u)); height: calc(40 * var(--u)); }
      html:root .one-top, html:root .film { left: calc(12 * var(--u)); right: calc(12 * var(--u)); }
      html:root .pill { height: calc(58 * var(--u)); border-radius: calc(29 * var(--u)); font-size: calc(21.5 * var(--u)); }
      html:root .pill.ic { width: calc(58 * var(--u)); padding: 0; justify-content: center; }
      html:root .pill.ic .lbl { display: none; }
      html:root .rbtn { width: calc(58 * var(--u)); height: calc(58 * var(--u)); }
      html:root .pill .icon, html:root .rbtn .icon { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
      html:root .rbtn.arr { display: none; }
      html:root .capt h1 { font-size: calc(44 * var(--u)); }
      html:root .film { height: calc(96 * var(--u)); border-radius: calc(24 * var(--u)); }
      html:root .grid.small { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
  <link rel="stylesheet" href="/kit/quiet.css">
  <link rel="stylesheet" href="/kit/narrow.css">
</head>
<body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
