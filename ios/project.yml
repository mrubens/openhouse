# The iPhone app (docs/iphone-app.md). `xcodegen` in this folder makes OpenHouse.xcodeproj from this file.
# Signing: put your team in Config/Local.xcconfig (DEVELOPMENT_TEAM = ...); it's gitignored, so no team id is committed.
name: OpenHouse
options:
  bundleIdPrefix: computer.openhouse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OpenHouse:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.openhouse.phone
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OpenHouse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: Share
      - target: Widgets
      - target: Notes
  Share:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.openhouse.phone.share
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.openhouse.phone.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
  Notes:
    type: app-extension
    platform: iOS
    sources: [Notes, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.openhouse.phone.notes
        INFOPLIST_FILE: Notes/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notes/Notes.entitlements
  Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.openhouse.phone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenHouse:
    build:
      targets:
        OpenHouse: all
    test:
      targets: [Tests]
