org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
kotlin.code.style=official
# The apps' Android package IDs: <appId>.shell (the display), .agent, .host (the update cover) and .app.<id> (each
# family app). The Kotlin packages keep the code name (dev.openhouse.*).
#
# OpenHouse's own IDs, on openhouse.computer (provisional: revisit before the beta). Releases (scripts/release.sh) are
# built under them; once a release reaches a tablet they can't change: Android updates an app only under the same ID
# (docs/self-update.md).
openhouse.releaseAppId=computer.openhouse
# What every other build uses (debug installs over adb: install-display.sh, tablet-setup.sh, the scripts' package
# names in env.sh). OpenHouse's own since the family tablet moved (2026-11-19). It now takes only builds signed with
# the release key, so a debug install there fails (different signer): it gets releases. Debug builds are for emulators
# and new test tablets. A tablet still on the prototype's IDs: OPENHOUSE_APP_ID=dev.openhouse and -Popenhouse.appId.
openhouse.appId=computer.openhouse
# The IDs tablets ran before. A display under them, built with -Popenhouse.moveTo, hands the tablet over to a release:
# its data and device owner (Move.kt, docs/self-update.md "Moving to OpenHouse").
openhouse.movedFrom=dev.openhouse
# Where releases look for updates (docs/self-update.md): the managed cloud's endpoint, or a static update.json at the
# same address. 1.0.8 is published there (stable, rescue 1.0.7); the next release is 1.0.9 or later. Builds for one tablet: scripts/release.sh --local. scripts/release.sh --update-url overrides it; a tablet takes one over adb.
openhouse.updateUrl=https://updates.openhouse.computer/v1/update
# The listening models a display downloads (VoiceModels.kt, docs/voice-models.md): the releases CDN's
# releases/voice/<version>/voice.json (openhouse-cloud/scripts/release.ts --voice uploads one). A new set is a new version here,
# carried by a release. Empty: no download (models only over adb, scripts/voice-install.sh).
openhouse.voiceUrl=https://d15yaylh7unz6h.cloudfront.net/releases/voice/5/voice.json
# The release key's certificate (SHA-256, scripts/release-key.sh prints it): a display under the old IDs hands the
# tablet only to an app signed with it. Not secret. Empty until the key is made.
openhouse.releaseCert=0b24b2144c92f3a771eaa153779248118a5bcbfe1c8fd5aa75e78a02b58eedd8
android.useAndroidX=true
