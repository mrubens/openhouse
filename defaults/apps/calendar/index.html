<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); --red: #d9543f; --blue: #3f74d9; --green: #4fa87a; --gold: #e2a93b; --scrim: rgba(0, 0, 0, .6); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--door); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }
    .icon svg { width: 100%; height: 100%; }
    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }
    .chip.on { background: var(--ink); color: #fff; }
    .chip .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }
    .round:disabled { background: rgba(255, 255, 255, .3); color: rgba(36, 40, 42, .3); }
    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(16 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .soft-text { color: var(--ink-soft); }
    .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    /* The week is one grid: a panel a day behind (.col), its name, the bars across the days, then each day's events. */
    .week { height: 94%; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: calc(12 * var(--u)); }
    .col { min-width: 0; border-radius: calc(24 * var(--u)); background: rgba(255, 255, 255, .55); }
    .week > .col-top { margin: calc(12 * var(--u)) calc(12 * var(--u)) calc(10 * var(--u)); }
    .week > .col-events { margin: 0 calc(12 * var(--u)) calc(12 * var(--u)); min-width: 0; }
    /* The same type as the event cards (quiet.css .chipv): a bar is one of them, stretched across its days. */
    .wbar { margin: 0 calc(12 * var(--u)) calc(8 * var(--u)); border-radius: calc(12 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); font-size: calc(18 * var(--u)); font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .wbar .bt { font-size: calc(14 * var(--u)); font-weight: 500; color: var(--ink-soft); margin-right: calc(8 * var(--u)); }
    /* What the household's apps put on a day (a school lunch, trash day): notes, not events. An event is filled, a note
       is outlined: a day's notes are one hairline card (a slip), a row each, the label like an event's time and the value
       at its title's size (quiet.css .chipv), wrapped between words and never cut. */
    .slip { flex: none; min-width: 0; display: flex; flex-direction: column; border: 1px solid color-mix(in srgb, var(--ink) 24%, var(--bg)); border-radius: calc(12 * var(--u)); }
    .nt { display: block; min-width: 0; padding: calc(7 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u)); }
    .nt + .nt { border-top: 1px solid var(--line); }
    .nt:active { background: var(--tint); }
    .nt:first-child { border-radius: calc(11 * var(--u)) calc(11 * var(--u)) 0 0; } .nt:last-child { border-radius: 0 0 calc(11 * var(--u)) calc(11 * var(--u)); } .nt:only-child { border-radius: calc(11 * var(--u)); }
    .nl { display: flex; align-items: center; gap: calc(6 * var(--u)); font-size: calc(14 * var(--u)); font-weight: 500; color: var(--ink-soft); white-space: nowrap; overflow: hidden; }
    .nv { display: block; font-size: calc(18 * var(--u)); font-weight: 400; line-height: 1.3; text-wrap: pretty; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .nv .or { color: var(--ink-soft); }
    .nkid { width: calc(8 * var(--u)); height: calc(8 * var(--u)); border-radius: 50%; flex: none; }
    /* the day (and list): the notes in full, each choice on its own line */
    .slip.full .nt { padding: calc(13 * var(--u)) calc(17 * var(--u)) calc(14 * var(--u)); }
    .slip.full .nl { font-size: calc(16 * var(--u)); margin-bottom: calc(2 * var(--u)); }
    .slip.full .nv { font-size: calc(22 * var(--u)); }
    .slip.list { max-width: calc(560 * var(--u)); }
    /* a note, tapped */
    .nsheet .k { font-size: calc(17 * var(--u)); font-weight: 500; color: var(--ink-soft); display: flex; align-items: center; gap: calc(8 * var(--u)); }
    .sheet.nsheet h2 { font-size: calc(30 * var(--u)); line-height: 1.25; margin-top: calc(-10 * var(--u)); }
    .nsheet h2 .or { font-weight: 400; color: var(--ink-soft); }
    .nsheet .from { margin: calc(-10 * var(--u)) 0 0; font-size: calc(18 * var(--u)); color: var(--ink-soft); }
    .nsheet .show { display: flex; align-items: center; gap: calc(8 * var(--u)); padding-top: calc(20 * var(--u)); border-top: 1px solid var(--line); flex-wrap: wrap; }
    .nsheet .show .label { width: calc(64 * var(--u)); }
    /* From apps: one row an app */
    .app-row { display: flex; align-items: center; gap: calc(14 * var(--u)); min-width: 0; }
    .app-row .app-name { flex: none; width: calc(220 * var(--u)); font-size: calc(20 * var(--u)); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-row .chips { flex: 1; min-width: 0; }
    .wbar.past { color: rgba(36, 40, 42, .5); }
    .wbar.cut-l, .mbar.cut-l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .wbar.cut-r, .mbar.cut-r { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .col.today { background: #fff; }
    .col-top { display: flex; align-items: center; border-radius: calc(16 * var(--u)); padding: calc(2 * var(--u)) 0 calc(4 * var(--u)) calc(6 * var(--u)); }
    .col-top .dow { flex: 1; font-size: calc(24 * var(--u)); font-weight: 800; color: var(--ink-soft); }
    .col-top.today .dow { color: var(--red); }
    .num { width: calc(50 * var(--u)); height: calc(50 * var(--u)); border-radius: 50%; display: grid; place-items: center; font-size: calc(26 * var(--u)); font-weight: 800; flex: none; }
    .col-top.today .num, .num.now { background: var(--red); color: #fff; }
    .col-events { flex: 1; display: flex; flex-direction: column; gap: calc(8 * var(--u)); }
    .chipv .src { font-size: calc(14 * var(--u)); font-weight: 500; color: var(--ink-soft); margin-top: calc(2 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-rest { flex: 1 0 calc(60 * var(--u)); }
    .chipv { border-radius: calc(14 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); }
    .chipv .when { font-size: calc(19 * var(--u)); font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chipv .what { font-size: calc(25 * var(--u)); font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .chipv.past .what { color: rgba(36, 40, 42, .5); }
    .chipv .whose { font-size: calc(18 * var(--u)); font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .month { height: 94%; display: flex; flex-direction: column; gap: calc(8 * var(--u)); }
    .mhead, .mweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: calc(8 * var(--u)); }
    .mweek { flex: 1; min-height: 0; }
    .mweek > .num { margin: calc(8 * var(--u)) 0 calc(5 * var(--u)) calc(8 * var(--u)); }
    .mweek > .num.out { color: rgba(94, 100, 102, .6); }
    .mbar { margin: 0 calc(8 * var(--u)) calc(5 * var(--u)); min-width: 0; }
    .cell-rest { margin: 0 calc(8 * var(--u)) calc(8 * var(--u)); min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(5 * var(--u)); }
    .mdow { font-size: calc(22 * var(--u)); font-weight: 800; color: var(--ink-soft); padding-left: calc(12 * var(--u)); }
    .cell { min-height: 0; min-width: 0; border-radius: calc(18 * var(--u)); background: rgba(255, 255, 255, .6); }
    .cell.today { background: #fff; }
    .cell.out { background: rgba(255, 255, 255, .25); }
    .mweek > .num { width: calc(42 * var(--u)); height: calc(42 * var(--u)); font-size: calc(23 * var(--u)); }
    .mev { font-size: calc(17 * var(--u)); font-weight: 700; border-radius: calc(8 * var(--u)); padding: calc(3 * var(--u)) calc(8 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .more { font-size: calc(16 * var(--u)); font-weight: 700; color: var(--ink-soft); padding-left: calc(6 * var(--u)); }
    .agenda { height: 94%; padding-right: calc(160 * var(--u)); display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .aday { margin: calc(8 * var(--u)) 0 0; font-size: calc(30 * var(--u)); font-weight: 800; }
    .aday.today { color: var(--red); }
    .rows { background: #fff; border-radius: calc(24 * var(--u)); padding: calc(6 * var(--u)) 0; flex: none; }
    .erow { display: flex; align-items: center; gap: calc(20 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)); }
    .erow .when { width: calc(140 * var(--u)); flex: none; font-size: calc(24 * var(--u)); font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
    .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .dot.big { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
    .erow .what { flex: 1; min-width: 0; font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .erow .whose { font-size: calc(22 * var(--u)); font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
    .nothing { margin: 0; padding-top: calc(60 * var(--u)); font-size: calc(34 * var(--u)); font-weight: 700; color: var(--ink-soft); }
    .nothing.small { padding: calc(24 * var(--u)); font-size: calc(28 * var(--u)); }
    .note { margin: calc(12 * var(--u)) calc(180 * var(--u)) 0 0; font-size: calc(19 * var(--u)); font-weight: 600; color: var(--ink-soft); }
    .card-top { display: flex; align-items: center; gap: calc(16 * var(--u)); }
    .day-name { flex: 1; margin: 0; font-size: calc(44 * var(--u)); font-weight: 800; }
    .day-name.today { color: var(--red); }
    .day-date { font-size: calc(28 * var(--u)); font-weight: 700; color: var(--ink-soft); }
    button.day-date { background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
    .day-rows { max-height: calc(100vh - calc(420 * var(--u))); flex: 0 1 auto; }
    .ev-title { display: flex; align-items: center; gap: calc(16 * var(--u)); }
    .ev-title h2 { font-size: calc(40 * var(--u)); flex: 1; }
    .line { margin: calc(-8 * var(--u)) 0 0; font-size: calc(24 * var(--u)); font-weight: 700; color: var(--ink-soft); }
    .line.light { font-weight: 600; }
    .line.ink { color: var(--ink); }
    .sheet .actions { padding-top: calc(10 * var(--u)); }
    /* the day by the hour */
    /* the hours on the left; on the right what holds for the whole day: its weather, the all-day things, then the notes */
    .dayview { height: 94%; display: grid; grid-template-columns: minmax(0, 1fr) calc(382 * var(--u)); grid-template-rows: minmax(0, 1fr); gap: calc(36 * var(--u)); }
    .dside { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(12 * var(--u)); border-top: 1px solid var(--line); padding-top: calc(19 * var(--u)); }
    .dwx { display: flex; align-items: baseline; gap: calc(14 * var(--u)); margin-bottom: calc(12 * var(--u)); }
    .dwx .hi { font-size: calc(53 * var(--u)); font-weight: 300; letter-spacing: -.03em; line-height: 1; }
    .dwx .rest { font-size: calc(19 * var(--u)); color: var(--ink-soft); line-height: 1.35; }
    .dside .wbar { margin: 0; padding: calc(11 * var(--u)) calc(14 * var(--u)); font-size: calc(19 * var(--u)); white-space: normal; flex: none; }
    .hours { min-height: 0; border-top: 1px solid var(--line); }
    .hours-in { position: relative; }
    .hour { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--line); }
    .hour-label { position: absolute; left: 0; top: calc(-11 * var(--u)); width: calc(64 * var(--u)); text-align: right; font-size: calc(15 * var(--u)); color: var(--ink-soft); }
    .block { position: absolute; border-left: none; border-top: calc(3 * var(--u)) solid; border-radius: calc(12 * var(--u)); padding: calc(8 * var(--u)) calc(12 * var(--u)); overflow: hidden; box-sizing: border-box; }
    .block-what { font-size: calc(19 * var(--u)); font-weight: 600; line-height: 1.2; }
    .block-when { font-size: calc(14 * var(--u)); color: var(--ink-soft); margin-top: calc(2 * var(--u)); }
    .now-line { position: absolute; left: calc(70 * var(--u)); right: 0; height: calc(2 * var(--u)); background: var(--accent); }
    .now-line::before { content: ''; position: absolute; left: calc(-6 * var(--u)); top: calc(-5 * var(--u)); width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; background: var(--accent); }
    /* the event form */
    .sheet .row { display: flex; align-items: center; gap: calc(12 * var(--u)); min-width: 0; }
    .sheet .row .chips { flex: 1; min-width: 0; flex-wrap: nowrap; }
    .sheet .label { flex: none; width: calc(90 * var(--u)); font-size: calc(17 * var(--u)); color: var(--ink-soft); }
    .sheet .label.soft { width: auto; white-space: nowrap; }
    .form .two { display: flex; gap: calc(12 * var(--u)); }
    .form .two .field { font-size: calc(20 * var(--u)); }
    .line.notes { white-space: pre-wrap; color: var(--ink); }
    .line.small { font-size: calc(16 * var(--u)); }
    /* a flyer's events, to tick before adding */
    .flyer-list { display: flex; flex-direction: column; gap: calc(10 * var(--u)); max-height: calc(420 * var(--u)); overflow-y: auto; }
    .flyer-ev { display: flex; align-items: flex-start; gap: calc(16 * var(--u)); text-align: left; padding: calc(14 * var(--u)) calc(18 * var(--u)); border-radius: calc(18 * var(--u)); border: 0; background: rgba(36,40,42,.05); color: var(--ink); font: inherit; min-height: calc(64 * var(--u)); }
    .flyer-ev .tick { flex: none; width: calc(34 * var(--u)); height: calc(34 * var(--u)); border-radius: calc(10 * var(--u)); border: calc(2.5 * var(--u)) solid var(--ink-soft); display: grid; place-items: center; }
    .flyer-ev.on .tick { background: var(--ink); border-color: var(--ink); color: #fff; }
    .flyer-ev .tick .icon { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
    .flyer-ev .what { display: flex; flex-direction: column; gap: calc(2 * var(--u)); font-size: calc(19 * var(--u)); color: var(--ink-soft); }
    .flyer-ev .what b { font-size: calc(23 * var(--u)); color: var(--ink); }
    .flyer-ev .what .n { font-size: calc(17 * var(--u)); }
    [role="button"]:focus-visible, button:focus-visible { outline: calc(3 * var(--u)) solid var(--accent); outline-offset: calc(2 * var(--u)); }
      .wx { font-size: calc(16 * var(--u)); font-weight: 500; color: var(--ink-soft, #8f877d); margin-left: calc(8 * var(--u)); white-space: nowrap; }
    .wx-rain { color: #5b8def; }
  </style>
