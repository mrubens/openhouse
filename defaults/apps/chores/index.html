<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); --red: #d9543f; --blue: #3f74d9; --green: #4fa87a; --gold: #e2a93b; --scrim: rgba(0, 0, 0, .6); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--door); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }
    .icon svg { width: 100%; height: 100%; }
    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }
    .chip.on { background: var(--ink); color: #fff; }
    .chip .dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; flex: none; }
    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }
    .round:disabled { background: rgba(255, 255, 255, .3); color: rgba(36, 40, 42, .3); }
    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(16 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .soft-text { color: var(--ink-soft); }
    .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .top { gap: calc(14 * var(--u)); }
    .none { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(20 * var(--u)); text-align: center; }
    .none.top-gap { flex: none; justify-content: flex-start; padding-top: calc(80 * var(--u)); }
    .none h2 { margin: 0 0 calc(4 * var(--u)); font-size: calc(44 * var(--u)); font-weight: 800; color: var(--ink-soft); }
    .none p { margin: 0; font-size: calc(26 * var(--u)); font-weight: 600; color: var(--ink-soft); }
    .columns { flex: 1; min-height: 0; display: flex; gap: calc(18 * var(--u)); padding-right: calc(120 * var(--u)); }
    .person { flex: none; height: 100%; border-radius: calc(28 * var(--u)); padding: calc(20 * var(--u)); display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .person-top { display: flex; align-items: center; gap: calc(16 * var(--u)); }
    .initial { flex: none; width: calc(76 * var(--u)); height: calc(76 * var(--u)); border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: calc(40 * var(--u)); font-weight: 800; }
    .person .name { min-width: 0; margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stars { display: inline-flex; align-items: center; gap: calc(6 * var(--u)); font-size: calc(30 * var(--u)); font-weight: 800; }
    .person-list { flex: 1; display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
    .all-done { display: flex; align-items: center; justify-content: center; gap: calc(12 * var(--u)); font-size: calc(32 * var(--u)); font-weight: 800; }
    .routine { flex: none; border-radius: calc(20 * var(--u)); padding: calc(12 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
    .routine-name { padding-left: calc(6 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 800; color: var(--ink-soft); }
    .steps { display: grid; grid-template-columns: 1fr 1fr; gap: calc(10 * var(--u)); }
    .step { border-radius: calc(18 * var(--u)); background: #fff; padding: calc(10 * var(--u)); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pic-wrap { position: relative; display: grid; place-items: center; }
    .pic-svg { display: inline-flex; }
    .pic-svg svg { width: 100%; height: 100%; }
    .pic { width: calc(84 * var(--u)); height: calc(84 * var(--u)); }
    .step.done .pic { opacity: .45; }
    .tick { position: absolute; width: calc(56 * var(--u)); height: calc(56 * var(--u)); border-radius: 50%; display: grid; place-items: center; color: #fff; }
    .tick.pop, .chore.pop .check { animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }
    .tick .icon { width: calc(38 * var(--u)); height: calc(38 * var(--u)); }
    .step-text { font-size: calc(20 * var(--u)); font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .step.done .step-text { color: var(--ink-soft); }
    .chore { flex: none; display: flex; align-items: center; gap: calc(18 * var(--u)); border-radius: calc(20 * var(--u)); background: #fff; padding: calc(16 * var(--u)) calc(18 * var(--u)); }
    .chore .check { flex: none; width: calc(64 * var(--u)); height: calc(64 * var(--u)); border-radius: 50%; background: rgba(36, 40, 42, .07); display: grid; place-items: center; color: #fff; }
    .chore .check .icon { width: calc(42 * var(--u)); height: calc(42 * var(--u)); }
    .chore .task { flex: 1; min-width: 0; font-size: calc(28 * var(--u)); font-weight: 700; overflow-wrap: anywhere; }
    .chore.done .task { color: var(--ink-soft); }
    .chore.done .task .t { text-decoration: line-through; }
    .chore .sub { display: block; font-size: calc(20 * var(--u)); font-weight: 600; color: var(--ink-soft); text-decoration: none; margin-top: calc(2 * var(--u)); }
    .chore.skipped .task { color: var(--ink-soft); }
    .chore.skipped .check { background: transparent; box-shadow: inset 0 0 0 calc(3 * var(--u)) rgba(36, 40, 42, .14); }
    .chore .worth { flex: none; display: inline-flex; align-items: center; gap: calc(4 * var(--u)); font-size: calc(22 * var(--u)); font-weight: 800; color: var(--ink-soft); }
    .chore .more { flex: none; width: calc(56 * var(--u)); height: calc(56 * var(--u)); margin: calc(-6 * var(--u)) calc(-8 * var(--u)) calc(-6 * var(--u)) 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); display: grid; place-items: center; padding: 0; }
    .chore .more .icon { width: calc(30 * var(--u)); height: calc(30 * var(--u)); }
    .name-box { flex: 1; min-width: 0; }
    .week-done { font-size: calc(20 * var(--u)); font-weight: 600; color: var(--ink-soft); }
    .chips.wrap { flex-wrap: wrap; overflow: visible; margin-top: calc(16 * var(--u)); }
    .chip-label { align-self: center; font-size: calc(22 * var(--u)); font-weight: 700; color: var(--ink-soft); margin-right: calc(6 * var(--u)); }
    @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
    .rewards { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(20 * var(--u)); }
    .kids { flex: none; align-items: center; gap: calc(12 * var(--u)); }
    .kid { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: rgba(255, 255, 255, .7); padding: 0 calc(28 * var(--u)); display: inline-flex; align-items: center; gap: calc(12 * var(--u)); font-size: calc(30 * var(--u)); font-weight: 800; white-space: nowrap; }
    .kid.on { color: #fff; }
    .gap { flex: none; width: calc(8 * var(--u)); }
    .reward-row { flex: none; display: flex; gap: calc(18 * var(--u)); padding-right: calc(120 * var(--u)); }
    .reward { flex: none; width: calc(380 * var(--u)); border-radius: calc(28 * var(--u)); background: #fff; padding: calc(26 * var(--u)); display: flex; flex-direction: column; gap: calc(16 * var(--u)); }
    .reward-title { font-size: calc(38 * var(--u)); font-weight: 800; line-height: 1.3; height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .reward-stars { display: flex; align-items: center; gap: calc(8 * var(--u)); font-size: calc(40 * var(--u)); font-weight: 800; }
    .bar { height: calc(22 * var(--u)); border-radius: calc(11 * var(--u)); background: rgba(36, 40, 42, .08); overflow: hidden; }
    .bar > div { height: 100%; border-radius: calc(11 * var(--u)); }
    .reward-note { min-height: calc(84 * var(--u)); display: flex; align-items: center; font-size: calc(26 * var(--u)); font-weight: 700; color: var(--ink-soft); }
    .reward-note.strong { font-weight: 800; }
    .btn.wide { width: 100%; }
    .last { margin: 0; font-size: calc(22 * var(--u)); font-weight: 600; color: var(--ink-soft); }
    .routines { flex: 1; display: flex; flex-direction: column; gap: calc(18 * var(--u)); padding-right: calc(120 * var(--u)); }
    .routine-card { flex: none; border-radius: calc(28 * var(--u)); background: #fff; padding: calc(24 * var(--u)); display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .routine-card h2 { margin: 0; font-size: calc(36 * var(--u)); font-weight: 800; }
    .step-row { display: flex; align-items: center; gap: calc(14 * var(--u)); }
    .step-tile { flex: none; width: calc(150 * var(--u)); border-radius: calc(18 * var(--u)); background: rgba(36, 40, 42, .05); padding: calc(10 * var(--u)); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .add-step { width: calc(84 * var(--u)); height: calc(84 * var(--u)); }
    .hint { margin: 0; font-size: calc(26 * var(--u)); font-weight: 600; color: var(--ink-soft); }
    .actions.start { justify-content: flex-start; gap: calc(14 * var(--u)); }
    .pick { flex: none; width: calc(90 * var(--u)); height: calc(90 * var(--u)); border-radius: calc(18 * var(--u)); background: rgba(36, 40, 42, .05); padding: calc(10 * var(--u)); display: grid; }
    .pick.on { background: rgba(36, 40, 42, .18); }
    .pick-row { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; margin-top: calc(16 * var(--u)); }
    .chore .chore-pic { flex: none; width: calc(46 * var(--u)); height: calc(46 * var(--u)); }
    .chore.done .chore-pic { opacity: .45; }
    .chore .sub.late { color: var(--red); }
    .pick .pic-svg { width: 100%; height: 100%; }
  </style>
  <link rel="stylesheet" href="/kit/quiet.css">
</head>
<body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
