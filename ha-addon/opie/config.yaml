# Opie's hub as a Home Assistant add-on. The image is the hub's own, published per Opie release
# (github.com/mrubens/openhouse, .github/workflows/hub-image.yml); `version` is the tag the Supervisor pulls.
name: Opie
version: "1.0.81"
slug: opie
description: Your household's day, lists and apps on every phone, computer and TV, and Opie to ask, connected to this Home Assistant.
url: https://github.com/mrubens/openhouse
arch:
  - aarch64
  - amd64
image: ghcr.io/mrubens/openhouse/hub
init: false # the image has its own (tini)
startup: application
boot: auto
timeout: 30
# The home network itself: phones, computers and TVs reach the hub on 8788, and it finds TVs, speakers and printers
# on the Wi-Fi (multicast and a sweep of the network, which an add-on's own network doesn't reach).
host_network: true
ports:
  8788/tcp: 8788
  8789/tcp: null
webui: "[PROTO:ssl]://[HOST]:[PORT:8788]/hub/"
watchdog: "tcp://[HOST]:[PORT:8788]"
# This Home Assistant, through the Supervisor's proxy (http://supervisor/core/api) with the add-on's own token: only
# the hub's keeper gets the token, and it lets through only lights, switches, scenes and media players, and
# thermostats to read, of what the household picks.
homeassistant_api: true
map:
  - type: share # backups to a folder: /share/opie
    read_only: false
  - type: ssl # https on the home network, with this Home Assistant's certificate
# What the keeper holds (calendar links, the own OpenAI key, the PIN, and the key they're sealed with) never goes in a
# backup, as on every Opie device; nor do the logs.
backup_exclude:
  - "keeper/*"
  - "hub/*.log"
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  settings_code: false
  forget_pin: false
schema:
  ssl: bool
  certfile: str
  keyfile: str
  settings_code: bool
  forget_pin: bool
