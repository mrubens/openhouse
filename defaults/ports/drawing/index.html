<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout (as the native app measured), scaled to the screen. */
    :root {
      --u: calc(100vw / 1536);
      --dark: rgb(20, 27, 37); --panel: rgb(31, 41, 54); --light: rgb(237, 241, 247); --accent: rgb(147, 222, 202);
      --muted: rgb(158, 176, 194); --frame: rgb(45, 55, 69); --ring: rgb(91, 105, 120); --picked: rgb(54, 77, 80);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--dark); color: var(--light); }
    body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(16 * var(--u)) calc(24 * var(--u)); }

    .btn { display: flex; align-items: center; justify-content: center; text-align: center; min-width: 0; padding: 0 calc(12 * var(--u));
      border-radius: calc(18 * var(--u)); background: var(--panel); color: var(--light); font-size: calc(22 * var(--u)); font-weight: 600; line-height: 1.1;
      transition: background .12s, color .12s, transform .08s; }
    .btn:active { transform: scale(.97); }
    .btn.on { background: var(--accent); color: var(--dark); font-weight: 800; }
    .btn[disabled] { opacity: .55; }

    header { flex: none; height: calc(80 * var(--u)); display: flex; align-items: center; gap: calc(12 * var(--u)); }
    header h1 { flex: 1; margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; letter-spacing: .01em; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
    header .btn { flex: none; width: calc(140 * var(--u)); height: calc(64 * var(--u)); }

    main { flex: 1; min-height: 0; display: flex; margin-top: calc(16 * var(--u)); }
    .frame { flex: 1; min-width: 0; margin-right: calc(20 * var(--u)); background: var(--frame); border-radius: calc(22 * var(--u)); padding: calc(10 * var(--u)); }
    .frame canvas { display: block; width: 100%; height: 100%; touch-action: none; border-radius: calc(12 * var(--u)); }

    /* The tool column stops short of the bottom, so the bottom-right corner stays clear for the assistant. */
    .tools { flex: none; width: calc(280 * var(--u)); margin-bottom: calc(160 * var(--u)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
      padding: calc(4 * var(--u)) calc(12 * var(--u)) calc(24 * var(--u)); display: flex; flex-direction: column; touch-action: pan-y; }
    .tools::-webkit-scrollbar { display: none; }
    .tools .btn { flex: none; height: calc(64 * var(--u)); margin-bottom: calc(8 * var(--u)); }
    .label { color: var(--muted); font-size: calc(19 * var(--u)); font-weight: 700; letter-spacing: .04em; padding: calc(8 * var(--u)) 0 calc(10 * var(--u)); }
    .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(8 * var(--u)) calc(10 * var(--u)); margin: calc(4 * var(--u)) calc(5 * var(--u)) calc(12 * var(--u)); }
    .swatch { height: calc(58 * var(--u)); border-radius: calc(32 * var(--u)); box-shadow: inset 0 0 0 calc(1 * var(--u)) var(--ring); }
    .swatch.on { box-shadow: 0 0 0 calc(4 * var(--u)) var(--accent); }
    .gap { height: calc(8 * var(--u)); flex: none; }

    /* sliders */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: calc(60 * var(--u)); margin: 0; background: transparent; flex: none; touch-action: none; --v: 50%; }
    input[type=range]::-webkit-slider-runnable-track { height: calc(10 * var(--u)); border-radius: calc(5 * var(--u));
      background: linear-gradient(90deg, var(--accent) var(--v), rgba(237, 241, 247, .18) var(--v)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: calc(40 * var(--u)); height: calc(40 * var(--u)); margin-top: calc(-15 * var(--u));
      border-radius: 50%; background: var(--accent); box-shadow: 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, .4); }
    input[type=range]::-moz-range-track { height: calc(10 * var(--u)); border-radius: calc(5 * var(--u)); background: linear-gradient(90deg, var(--accent) var(--v), rgba(237, 241, 247, .18) var(--v)); }
    input[type=range]::-moz-range-thumb { width: calc(40 * var(--u)); height: calc(40 * var(--u)); border: 0; border-radius: 50%; background: var(--accent); }
    input.mix::-webkit-slider-runnable-track { background: var(--track); height: calc(16 * var(--u)); border-radius: calc(8 * var(--u)); }
    input.mix::-moz-range-track { background: var(--track); height: calc(16 * var(--u)); border-radius: calc(8 * var(--u)); }
    input.mix::-webkit-slider-thumb { margin-top: calc(-12 * var(--u)); background: var(--light); }
    input.mix::-moz-range-thumb { background: var(--light); }

    /* cards (the native app's dialogs) */
    .scrim { position: fixed; inset: 0; background: rgba(5, 9, 14, .62); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 10; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .card { background: var(--dark); border-radius: calc(26 * var(--u)); padding: calc(28 * var(--u)) calc(30 * var(--u)) calc(24 * var(--u)); max-height: 92vh; overflow-y: auto;
      box-shadow: 0 calc(20 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(237, 241, 247, .08); transform: translateY(calc(12 * var(--u))) scale(.98); transition: transform .18s ease-out; }
    .scrim.open .card { transform: none; }
    .card h2 { margin: 0 0 calc(18 * var(--u)); font-size: calc(30 * var(--u)); font-weight: 800; }
    .card p { margin: 0 0 calc(22 * var(--u)); font-size: calc(24 * var(--u)); color: var(--muted); }
    .card .row { display: flex; align-items: center; gap: calc(8 * var(--u)); height: calc(84 * var(--u)); padding: 0 calc(16 * var(--u)); margin-bottom: calc(10 * var(--u));
      border-radius: calc(18 * var(--u)); background: var(--panel); width: 100%; color: var(--light); font-size: calc(24 * var(--u)); font-weight: 600; text-align: left; }
    .card .row.on { background: var(--picked); }
    .card .row .name { width: calc(240 * var(--u)); flex: none; }
    .card .row .chip { width: calc(44 * var(--u)); height: calc(48 * var(--u)); border-radius: calc(12 * var(--u)); flex: none; }
    .card .row .paper { width: calc(64 * var(--u)); height: calc(52 * var(--u)); border-radius: calc(12 * var(--u)); flex: none; margin-right: calc(12 * var(--u)); box-shadow: inset 0 0 0 1px var(--ring); }
    .card .actions { display: flex; justify-content: flex-end; gap: calc(12 * var(--u)); margin-top: calc(14 * var(--u)); }
    .card .actions .btn { height: calc(70 * var(--u)); min-width: calc(170 * var(--u)); font-size: calc(24 * var(--u)); }
    .card .actions .btn.go { background: var(--accent); color: var(--dark); font-weight: 800; }
    .card .actions .btn.danger { background: rgb(214, 92, 84); color: #fff; font-weight: 800; }
    .preview { height: calc(80 * var(--u)); border-radius: calc(18 * var(--u)); margin-bottom: calc(12 * var(--u)); }
    .mixlabel { font-size: calc(22 * var(--u)); font-weight: 700; margin-top: calc(8 * var(--u)); display: flex; justify-content: space-between; }
    .mixlabel span { color: var(--muted); }
    .card input.mix { height: calc(72 * var(--u)); }

    .past { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(16 * var(--u)); margin-bottom: calc(8 * var(--u)); }
    .tile { aspect-ratio: 5 / 3; border-radius: calc(16 * var(--u)); overflow: hidden; background: var(--panel); padding: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: calc(6 * var(--u)); color: var(--light); font-size: calc(24 * var(--u)); font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(237, 241, 247, .08); transition: transform .08s; }
    .tile:active { transform: scale(.97); }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile img:not([src]) { visibility: hidden; }
    .tile.new { background: var(--picked); }
    .toast { position: fixed; left: 50%; bottom: calc(40 * var(--u)); transform: translate(-50%, calc(20 * var(--u))); opacity: 0; pointer-events: none; z-index: 20;
      max-width: calc(900 * var(--u)); padding: calc(18 * var(--u)) calc(30 * var(--u)); border-radius: calc(40 * var(--u)); background: var(--light); color: var(--dark);
      font-size: calc(24 * var(--u)); font-weight: 700; text-align: center; box-shadow: 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
