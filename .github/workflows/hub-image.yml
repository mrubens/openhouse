# The hub's Docker image (hub/Dockerfile, docs/hub.md) for each release tag, for arm64 (a Raspberry Pi) and x86_64,
# each built on a runner of its own kind and started once: the pages answer and it has a settings code.
#
# PUBLISHING IS OFF. The publish job below pushes one public multi-arch image to GitHub's registry under this repo
# (ghcr.io/<owner>/<repo>/hub, tagged with the release and latest), with the workflow's own GITHUB_TOKEN. To turn it
# on, change its `if: ${{ false }}` to `if: ${{ startsWith(github.ref, 'refs/tags/v') }}` (release tags only), and make
# the package public on GitHub after its first push.
name: hub image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: opie-hub:test
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=hub-${{ matrix.arch }}
      - name: It starts, answers, has a settings code and "Hey Opie"
        run: |
          docker run -d --name hub -p 8788:8788 opie-hub:test
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8788/hub/ && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8788/hub/
          docker exec hub test -s /data/hub-setup.txt
          docker exec hub test -s /opt/openhouse/runtime/hub-voice/models/wake/opie.onnx
          docker exec hub test -d /opt/openhouse/runtime/hub-voice/node_modules/onnxruntime-node
      - if: failure()
        run: docker logs hub || true

  publish:
    needs: build
    # OFF until the owner says yes (see the top of this file).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hub
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=hub-amd64
            type=gha,scope=hub-arm64
