# The tests on every push and pull request to main: the bridge's and the shell's unit tests.
# No secrets: the bridge's cloud tests skip without a checkout of the private cloud repo, and the shell's unit tests
# build unsigned (no release key).
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (no dependencies: the bridge has no package-lock.json and nothing to install)
      # (each file's process is ended when its tests are done, and a stuck test fails after two minutes, so a handle
      # left open on the runner can't hang the job: it did on the first run, though not on a Mac)
      - run: node --test --test-force-exit --test-timeout=120000 --test-reporter=spec test/*.test.mjs
        working-directory: bridge

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # (the runner already has the Android SDK, with ANDROID_HOME set; gradle fetches the platform it needs)
      - run: ./gradlew -q :app:testReleaseUnitTest
        working-directory: shell
