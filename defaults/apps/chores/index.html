<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <style>
    /* Sizes are in u: one pixel of a 1536-wide layout, scaled to the screen, so it reads the same from across the room. */
    :root { --u: calc(100vw / 1536); --red: #d9543f; --blue: #3f74d9; --green: #4fa87a; --gold: #e2a93b; --scrim: rgba(0, 0, 0, .6); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--door); user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    .top { display: flex; align-items: center; gap: calc(16 * var(--u)); margin-bottom: calc(22 * var(--u)); flex: none; }
    .title { flex: 1; min-width: 0; margin: 0; font-size: calc(52 * var(--u)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { display: inline-flex; }

    .star { display: inline-flex; flex: none; }
    .star svg { width: 100%; height: 100%; }
    .chip { flex: none; height: calc(70 * var(--u)); border-radius: calc(35 * var(--u)); background: rgba(36, 40, 42, .07); padding: 0 calc(26 * var(--u)); font-size: calc(24 * var(--u)); font-weight: 700;
      display: inline-flex; align-items: center; gap: calc(12 * var(--u)); white-space: nowrap; }

    .btn { flex: none; height: calc(84 * var(--u)); border-radius: calc(42 * var(--u)); background: var(--ink); color: #fff; padding: 0 calc(40 * var(--u)); font-size: calc(28 * var(--u)); font-weight: 800; white-space: nowrap; }
    .btn.soft { background: rgba(36, 40, 42, .08); color: var(--ink); }
    .btn:disabled { opacity: .35; }
    .round { flex: none; width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgba(255, 255, 255, .8); color: var(--ink); display: grid; place-items: center; }
    .round .icon { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
    .round.dark { background: var(--ink); color: #fff; }

    .scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .scrim.high { align-items: flex-start; padding-top: calc(70 * var(--u)); }
    .sheet { width: calc(820 * var(--u)); max-width: 96vw; max-height: 92vh; overflow: auto; background: var(--paper); border-radius: calc(30 * var(--u)); padding: calc(30 * var(--u)) calc(36 * var(--u));
      display: flex; flex-direction: column; gap: calc(22 * var(--u)); color: var(--ink); }
    .sheet h2 { margin: 0; font-size: calc(34 * var(--u)); font-weight: 800; }
    .sheet h2.big { font-size: calc(36 * var(--u)); }
    .field { font: inherit; font-size: calc(36 * var(--u)); font-weight: 600; width: 100%; border-radius: calc(18 * var(--u)); background: #fff; border: calc(2 * var(--u)) solid rgba(36, 40, 42, .15);
      padding: calc(18 * var(--u)) calc(24 * var(--u)); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
    .field::placeholder { color: rgba(94, 100, 102, .6); }
    .extra { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .extra:empty { display: none; }
    .chips { display: flex; gap: calc(10 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .vscroll::-webkit-scrollbar { display: none; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; }
    .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .vscroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; min-height: 0; }
    .actions { display: flex; gap: calc(10 * var(--u)); justify-content: flex-end; flex-wrap: wrap; }
    .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .gl { display: inline-flex; flex: none; }
    .gl svg { width: 100%; height: 100%; }
    .none { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(20 * var(--u)); text-align: center; }
    .none.top-gap { flex: none; justify-content: flex-start; padding-top: calc(80 * var(--u)); }
    .none h2 { margin: 0 0 calc(4 * var(--u)); }
    .none p { margin: 0; color: var(--fg2); }
    @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }

    /* Today: a card per person in their own color (a person's color is theirs in every look, so the ink on it is fixed,
       --pi), their chores as rows on it; under them what anyone can do and what the stars are saving up for. */
    .today { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding-bottom: calc(8 * var(--u)); }
    .who-row { display: none; }
    .cols { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; gap: calc(16 * var(--u)); padding-bottom: calc(20 * var(--u)); margin-bottom: calc(-20 * var(--u)); }
    .pc { --pi: #15132b; --on-pi: #fff; color: var(--pi); background: var(--c); border-radius: calc(30 * var(--u)); padding: calc(22 * var(--u)) calc(18 * var(--u)) calc(18 * var(--u)); position: relative; overflow: hidden; display: flex; flex-direction: column;
      min-width: 0; min-height: 0; box-shadow: 0 calc(30 * var(--u)) calc(50 * var(--u)) calc(-28 * var(--u)) color-mix(in srgb, var(--c) 80%, transparent), inset 0 1px 0 rgba(255, 255, 255, .4); }
    .pc.plain { --pi: var(--ink); --on-pi: var(--on-ink); background: var(--card); box-shadow: var(--shadow); }
    .pc-top { display: flex; align-items: center; gap: calc(14 * var(--u)); padding: 0 calc(6 * var(--u)); position: relative; z-index: 1; flex: none; }
    .ring { position: relative; width: calc(76 * var(--u)); height: calc(76 * var(--u)); flex: none; }
    .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: rgba(255, 255, 255, .3); stroke: color-mix(in srgb, var(--pi) 16%, transparent); }
    .ring .arc { fill: none; stroke: var(--pi); stroke-linecap: round; }
    .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(30 * var(--u)); font-weight: 750; }
    .name-box { flex: 1; min-width: 0; }
    .pname { margin: 0; font-size: calc(32 * var(--u)); font-weight: 750; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .of { font-size: calc(16.5 * var(--u)); font-weight: 650; opacity: .7; margin-top: calc(6 * var(--u)); line-height: 1.25; }
    .pc.starred .pname { padding-right: calc(64 * var(--u)); }
    .starpill { position: absolute; right: calc(-2 * var(--u)); top: calc(-2 * var(--u)); height: calc(36 * var(--u)); padding: 0 calc(13 * var(--u)) 0 calc(10 * var(--u)); border-radius: calc(18 * var(--u)); background: rgba(21, 19, 43, .88); color: #ffd35c; font-size: calc(18 * var(--u)); font-weight: 750;
      display: inline-flex; align-items: center; gap: calc(6 * var(--u)); }
    .pc-list { margin-top: calc(22 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u)); flex: 0 1 auto; padding-bottom: calc(14 * var(--u)); position: relative; z-index: 1; }
    .ch { flex: none; min-height: calc(84 * var(--u)); border-radius: calc(22 * var(--u)); background: rgba(255, 255, 255, .42); display: flex; align-items: center; gap: calc(13 * var(--u)); padding: calc(10 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u)) calc(14 * var(--u)); font-size: calc(21 * var(--u)); font-weight: 700;
      letter-spacing: -.02em; line-height: 1.1; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 calc(10 * var(--u)) calc(18 * var(--u)) calc(-12 * var(--u)) rgba(21, 19, 43, .5); }
    .ch .ck { width: calc(46 * var(--u)); height: calc(46 * var(--u)); border-radius: 50%; border: calc(3.5 * var(--u)) solid color-mix(in srgb, var(--pi) 80%, transparent); flex: none; display: grid; place-items: center; color: var(--on-pi); }
    .ch .ck .icon { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
    .ch .ck .icon svg { stroke-width: 3.2; }
    .ch .task { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .ch .sub { display: block; font-size: calc(14.5 * var(--u)); font-weight: 600; letter-spacing: 0; opacity: .7; margin-top: calc(5 * var(--u)); }
    .ch .sub.late { opacity: 1; font-weight: 750; }
    .ch .worth { flex: none; display: inline-flex; align-items: center; gap: calc(3 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 750; opacity: .8; }
    .ch .g { flex: none; width: calc(44 * var(--u)); height: calc(44 * var(--u)); padding: 0; border-radius: 50%; display: grid; place-items: center; color: inherit; opacity: .75; }
    .ch .g .gl { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
    .ch.done { background: rgba(255, 255, 255, .2); box-shadow: none; }
    .ch.done .ck { background: var(--pi); border-color: var(--pi); }
    .ch.done .t { opacity: .55; text-decoration: line-through; text-decoration-thickness: calc(2 * var(--u)); }
    .ch.skipped { background: rgba(255, 255, 255, .2); box-shadow: none; }
    .ch.skipped .ck { border-color: color-mix(in srgb, var(--pi) 30%, transparent); }
    .ch.skipped .t { opacity: .55; }
    .ch.pop .ck, .tick.pop { animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }
    .pc.plain .ch, .any .ch { background: var(--tint); box-shadow: none; }
    .alld { margin-top: auto; text-align: center; padding-bottom: calc(26 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 750; letter-spacing: -.02em; position: relative; z-index: 1; flex: none; }
    .alld .gl { display: flex; width: calc(74 * var(--u)); height: calc(74 * var(--u)); margin: 0 auto calc(10 * var(--u)); }
    .deco { position: absolute; right: calc(-40 * var(--u)); bottom: calc(-50 * var(--u)); width: calc(260 * var(--u)); height: calc(260 * var(--u)); opacity: .13; pointer-events: none; }
    /* a routine in its hours: its steps as pictures, two to a row, for kids who can't read yet */
    .routine { flex: none; border-radius: calc(22 * var(--u)); background: rgba(255, 255, 255, .22); padding: calc(12 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
    .pc.plain .routine { background: transparent; padding: 0; }
    .rt-name { padding-left: calc(6 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 700; letter-spacing: 0; opacity: .75; }
    .steps { display: grid; grid-template-columns: 1fr 1fr; gap: calc(8 * var(--u)); }
    .stp { border-radius: calc(16 * var(--u)); background: rgba(255, 255, 255, .5); padding: calc(8 * var(--u)); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pc.plain .stp { background: var(--tint); }
    .stp.done { background: rgba(255, 255, 255, .2); }
    .pic-wrap { position: relative; display: grid; place-items: center; }
    .pic-svg { display: inline-flex; }
    .pic-svg svg { width: 100%; height: 100%; }
    .pic { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
    .stp.done .pic { opacity: .4; }
    .tick { position: absolute; width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: 50%; display: grid; place-items: center; background: var(--pi); color: var(--on-pi); }
    .tick .icon { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
    .stp-text { font-size: calc(15 * var(--u)); font-weight: 650; letter-spacing: -.01em; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .stp.done .stp-text { opacity: .6; }
    /* under the people */
    .bot { flex: none; height: calc(224 * var(--u)); display: grid; grid-template-columns: calc(404 * var(--u)) 1fr; gap: calc(16 * var(--u)); }
    .bot.one { grid-template-columns: 1fr; }
    .bot > section { padding: calc(22 * var(--u)) calc(24 * var(--u)); display: flex; flex-direction: column; overflow: hidden; }
    .any-list { margin-top: calc(16 * var(--u)); display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(300 * var(--u)), 1fr)); gap: calc(10 * var(--u)); align-content: start; }
    .any .ch { min-height: calc(92 * var(--u)); font-size: calc(24 * var(--u)); color: var(--ink); --pi: var(--ink); --on-pi: var(--on-ink); }
    .any-list:has(.ch + .ch) .ch { min-height: calc(64 * var(--u)); font-size: calc(21 * var(--u)); }
    .any-list:has(.ch + .ch) .ck { width: calc(40 * var(--u)); height: calc(40 * var(--u)); }
    .rew-grid { margin: auto 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(34 * var(--u)); }
    .rw { display: grid; grid-template-columns: calc(62 * var(--u)) 1fr; column-gap: calc(16 * var(--u)); align-items: center; min-width: 0; }
    .gi { width: calc(62 * var(--u)); height: calc(62 * var(--u)); border-radius: calc(20 * var(--u)); background: var(--c, var(--tint-2)); color: #15132b; display: grid; place-items: center; flex: none; }
    .gi .gl { width: calc(32 * var(--u)); height: calc(32 * var(--u)); }
    .rw b { font-size: calc(23 * var(--u)); font-weight: 700; letter-spacing: -.02em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rw span { font-size: calc(16 * var(--u)); font-weight: 600; color: var(--fg2); }
    .meter { height: calc(16 * var(--u)); border-radius: calc(8 * var(--u)); background: var(--tint-2); margin-top: calc(16 * var(--u)); overflow: hidden; }
    .meter > div { height: 100%; border-radius: calc(8 * var(--u)); background: var(--c, var(--ink)); }

    /* Rewards: whose, then what they're saving for, a panel each */
    .rewards { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(18 * var(--u)); }
    .kids { flex: none; align-items: center; padding: 0 calc(6 * var(--u)); }
    .kstars { display: inline-flex; align-items: center; gap: calc(4 * var(--u)); margin-left: calc(4 * var(--u)); font-weight: 700; opacity: .75; }
    .gap { flex: 1; }
    .rw-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(330 * var(--u)), 1fr)); gap: calc(16 * var(--u)); align-content: start; padding-bottom: calc(30 * var(--u)); }
    .rw-card { padding: calc(22 * var(--u)) calc(24 * var(--u)); display: flex; flex-direction: column; }
    .rw-card .rw b { white-space: normal; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .rw-card .meter { margin: calc(20 * var(--u)) 0 calc(16 * var(--u)); }
    .rw-note { min-height: calc(46 * var(--u)); display: flex; align-items: center; font-size: calc(17 * var(--u)); font-weight: 600; color: var(--fg2); }
    .rw-note.strong { color: var(--ink); }
    .btn.wide { width: 100%; }
    .last { margin: 0; padding: 0 calc(10 * var(--u)) calc(8 * var(--u)); color: var(--fg2); flex: none; }

    /* Routines: a panel each, its hours, whose it is and its steps */
    .routines { flex: 1; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding-bottom: calc(30 * var(--u)); }
    .rt-card { flex: none; padding: calc(22 * var(--u)) calc(24 * var(--u)); display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
    .rt-card h2 { margin: 0; font-size: calc(26 * var(--u)); font-weight: 700; letter-spacing: -.02em; }
    .stp-row { display: flex; align-items: center; gap: calc(10 * var(--u)); }
    .stp-tile { flex: none; width: calc(124 * var(--u)); border-radius: calc(16 * var(--u)); background: var(--tint); padding: calc(10 * var(--u)) calc(8 * var(--u)); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .add-step { margin-left: calc(6 * var(--u)); }
    .hint { margin: 0; padding: 0 calc(10 * var(--u)); color: var(--fg2); }
    .actions.start { justify-content: flex-start; padding: 0 calc(4 * var(--u)); }

    /* in the cards over the app */
    .chip-label { align-self: center; font-size: calc(15 * var(--u)); font-weight: 650; color: var(--fg2); margin-right: calc(6 * var(--u)); }
    .pick-row { display: flex; gap: calc(8 * var(--u)); overflow-x: auto; scrollbar-width: none; }
    .pick { flex: none; width: calc(64 * var(--u)); height: calc(64 * var(--u)); border-radius: calc(16 * var(--u)); background: var(--tint); padding: calc(8 * var(--u)); display: grid; }
    .pick.on { background: var(--tint-2); box-shadow: inset 0 0 0 calc(2.5 * var(--u)) var(--ink); }
    .pick .pic-svg { width: 100%; height: 100%; }
    .pick .gl { width: calc(34 * var(--u)); height: calc(34 * var(--u)); place-self: center; }
    /* On a phone: who has what left along the top (tap one for just theirs), then the people one under another. */
    @media (max-width: 700px) {
      html:root body .top { flex-wrap: nowrap; }
      html:root body .top > .title { flex: 1 1 0; }
      html:root body .top > .title span, html:root body .top > .round { display: none; }
      html:root body .q-seg > * { height: calc(50 * var(--u)); padding: 0 calc(14 * var(--u)); font-size: calc(20 * var(--u)); }
      .today { display: block; overflow-y: auto; scrollbar-width: none; padding-bottom: calc(30 * var(--u)); }
      .today::-webkit-scrollbar { display: none; }
      .who-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(calc(118 * var(--u)), 1fr); gap: calc(12 * var(--u)); overflow-x: auto; scrollbar-width: none; margin-bottom: calc(20 * var(--u)); }
      .who-row::-webkit-scrollbar { display: none; }
      .wt { border-radius: calc(29 * var(--u)); padding: calc(14 * var(--u)) calc(4 * var(--u)) calc(13 * var(--u)); background: var(--card); color: var(--ink); font-size: calc(20 * var(--u)); font-weight: 650; display: flex; flex-direction: column; align-items: center; gap: calc(9 * var(--u)); white-space: nowrap; }
      html:root .wt .q-av { width: calc(58 * var(--u)); height: calc(58 * var(--u)); font-size: calc(26 * var(--u)); }
      html:root .wt .q-av.all { background: var(--ink); color: var(--on-ink); font-size: calc(22 * var(--u)); }
      html:root .wt .q-av .icon { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
      .wt.on { background: var(--ink); color: var(--on-ink); }
      html:root .wt.on .q-av.all { background: var(--on-ink); color: var(--ink); }
      .cols { display: flex; flex-direction: column; gap: calc(20 * var(--u)); padding: 0; margin: 0; }
      .pc { flex: none; border-radius: calc(40 * var(--u)); padding: calc(26 * var(--u)) calc(23 * var(--u)) calc(23 * var(--u)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
      .pc.plain { box-shadow: var(--shadow); }
      .ring, .deco { display: none; }
      .pname { font-size: calc(40 * var(--u)); }
      .of { font-size: calc(21.5 * var(--u)); margin-top: calc(4 * var(--u)); }
      .starpill { height: calc(46 * var(--u)); border-radius: calc(23 * var(--u)); padding: 0 calc(17 * var(--u)) 0 calc(13 * var(--u)); font-size: calc(23 * var(--u)); }
      .pc-list { margin-top: calc(17 * var(--u)); gap: calc(12 * var(--u)); padding-bottom: 0; }
      .ch, .any .ch, .any-list:has(.ch + .ch) .ch { min-height: calc(98 * var(--u)); border-radius: calc(29 * var(--u)); font-size: calc(27 * var(--u)); gap: calc(17 * var(--u)); padding: calc(10 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u)) calc(17 * var(--u)); }
      .ch .ck, .any-list:has(.ch + .ch) .ck { width: calc(58 * var(--u)); height: calc(58 * var(--u)); border-width: calc(4.6 * var(--u)); }
      .ch .ck .icon { width: calc(34 * var(--u)); height: calc(34 * var(--u)); }
      .ch .sub { font-size: calc(19 * var(--u)); }
      .ch .g { width: calc(54 * var(--u)); height: calc(54 * var(--u)); }
      .ch .g .gl { width: calc(37 * var(--u)); height: calc(37 * var(--u)); }
      .alld { margin-top: calc(20 * var(--u)); padding-bottom: calc(6 * var(--u)); font-size: calc(27 * var(--u)); display: flex; align-items: center; justify-content: center; gap: calc(12 * var(--u)); }
      .alld .gl { width: calc(44 * var(--u)); height: calc(44 * var(--u)); margin: 0; }
      .rt-name { font-size: calc(20 * var(--u)); }
      .stp-text { font-size: calc(20 * var(--u)); }

      .bot > section { padding: calc(26 * var(--u)); overflow: visible; }

      .rt-card h2 { font-size: calc(32 * var(--u)); }

      .chip-label { font-size: calc(20 * var(--u)); }
    }
  </style>

  <link rel="stylesheet" href="/kit/narrow.css">
</head>
