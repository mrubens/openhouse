<!doctype html>
<html class="checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/kit/openhouse.css">
  <!-- Made on the tablet from the tab template (bridge/templates/tab): this file stays as it is. The app is main.js
       (it fills #app) and app.css (its own look). The quiet kit comes last, so its sizes win: --u is one pixel of a
       1536-wide screen, a phone's size under 700 px, and in a tab the home screen's. -->
  <style>
    :root { --u: calc(100vw / 1536); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(30 * var(--u)) calc(44 * var(--u)) calc(24 * var(--u)); }
    /* While the tablet is still making it: one quiet line, not a page half written (the kit's beingMade). */
    #making { display: none; }
    html.checking #app, html.making #app { visibility: hidden; }
    html.making #making { display: grid; place-items: center; position: fixed; inset: 0; z-index: 2147483647; background: var(--bg, #f5f3ee);
      color: var(--fg2, #6f6c66); font: 500 calc(24 * var(--u)) var(--quiet, system-ui, sans-serif); letter-spacing: -.01em; }
  </style>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="/kit/quiet.css">
  <link rel="stylesheet" href="/kit/narrow.css">
</head>
<body><div id="app"></div><div id="making">Making NAME…</div>
<script type="module">
  import { beingMade } from '/kit/openhouse.js';
  const root = document.documentElement, shown = () => root.classList.remove('checking');
  setTimeout(shown, 1500); // (never kept hidden by a slow answer)
  (async function look() { const on = await beingMade(); root.classList.toggle('making', on); shown(); if (on) setTimeout(look, 1500); })();
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
